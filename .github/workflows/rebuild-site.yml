name: Rebuild Site and Deploy Dashboard

on:
  push:
    branches:
      - main
      - master
      - preview
      - canary
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-site:
    name: Rebuild Site & Applications
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Prepare environment files
        shell: bash
        run: |
          for app in admin api live space web; do
            if [ -f "apps/$app/.env.example" ] && [ ! -f "apps/$app/.env" ]; then
              cp "apps/$app/.env.example" "apps/$app/.env"
            fi
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm turbo run check:types

      - name: Build site (Turborepo)
        run: pnpm turbo run build

      - name: Verify build artifacts
        run: |
          test -d apps/web/build/client
          echo "Site build artifacts verified successfully."

      - name: Build GitHub Pages Dashboard
        run: node scripts/build-pages.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy-pages:
    name: Deploy Dashboard to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

